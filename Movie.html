<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <link rel="stylesheet" href="Movie.css">
</head>
<body>
    <div class="main">
        <p class="project-title">GITHUB PRACTICE PROJECT</p>
        <h1>Movie Watchlist</h1>
        <p class="description">Practice CRUD, DOM manipulation and the GitHub Pull Request workflow.</p>

        <form>
            <h3>Add / Update Movie</h3>

            <div class="form-row">
                <div class="input-box">
                    <p>Movie title</p>
                    <input type="text" id="title" placeholder="Enter movie title">
                </div>

                <div class="input-box">
                    <p>Genre</p>
                    <input type="text" id="genre" placeholder="Enter genre">
                </div>
            </div>

            <div class="form-row">
                <div class="input-box">
                    <p>Release year</p>
                    <input type="text" id="year" placeholder="Enter release year">
                </div>

                <div class="input-box">
                    <p>Status</p>
                    <select id="Status" name="Status">
                        <option value="" disabled selected hidden>Select Status</option>
                        <option value="Planned">Planned</option>
                        <option value="Watched">Watched</option>
                    </select>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="update-button">Add Movie</button>
                <button type="button" class="cancel-button">Cancel Edit</button>
            </div>
        </form>

        <div class="movie-list">
            <div class="list-top">
                <input class="search" type="text" placeholder="Search movies...">

                <select class="filter">
                    <option value="all">All statuses</option>
                    <option value="Planned">Planned</option>
                    <option value="Watched">Watched</option>
                </select>
            </div>

            <div class="movies"></div>
        </div>
    </div>

    <script src="Movie.js"></script>
</body>
</html>
