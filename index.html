<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p class="githead">GITHUB PRACTICE PROJECT</p>
        <h1>Movie Watchlist</h1>
        <p class="pra">Practice CRUD , DOM manipulation and the Github Pull Request workflow.</p>
    </header>
    <div class="entry">
        <h3>Add / Update Movie</h3>
        <form action="">
            <div class="kkk">

            
            <div class="blc">
            <div class="cont">
                <label class="titles" for="movie title">Movie title</label>
                <input class="inp"type="text" id = "movie title" placeholder="The Dark Knigh">
            </div>

            <div class="cont">
                <label class="titles" for="Genre">Genre</label>
                <input type="text" class="inp"  id = "Genre" placeholder="Action">
            </div>
            </div>
            <div class="blc">
            <div class="cont">
                <label class="titles" for="Release Year">Release Year</label>
                <input type="text" class="inp" id = "Release Year" placeholder="2025">
            </div>
            <div class="cont">
                <label class="titles" for="Status">Status</label>
            <select name="status" id="Status">
                <option value="Planned" class="kk">Planned</option>
                <option value="Watched" class="kk">Watched</option>
            </select>
            </div>
            </div>
            </div>

            <button type="submit" class="update">Update/Register Values</button>
            <button class="update" type="reset">Reset</button>
        </form>
    </div>
</body>
</html>
